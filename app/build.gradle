apply plugin: 'com.android.application'

android {
    // Load local.properties if present — not required for debug builds
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
    }

    compileSdkVersion 34

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId 'sksa.aa.tweaker'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 35
        versionName '5.3.0'
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "AA-AIO-TWEAKER-" + versionName)
    }

    // Signing config is optional — only applied when local.properties provides keys
    if (localProps['STORELOCATION']) {
        signingConfigs {
            release {
                storeFile file(localProps['STORELOCATION'])
                storePassword localProps['STOREPASSWORD']
                keyAlias 'key0'
                keyPassword localProps['KEYPASSWORD']
            }
        }
        android.buildTypes.release.signingConfig = signingConfigs.release
    }

    def pastebinKey = "\"${localProps['PASTEBIN_API_KEY'] ?: ''}\""

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "PASTEBIN_API_KEY", pastebinKey
        }
        debug {
            buildConfigField "String", "PASTEBIN_API_KEY", pastebinKey
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Android Support (kept until AndroidX migration — see Roadmap Phase 2)
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    // UI libs — migrated from jcenter to JitPack
    implementation 'com.github.romandanylyk:PageIndicatorView:v1.0.3'   // was com.romandanylyk:pageindicatorview:1.0.1
    implementation 'com.github.HeinrichReimer:android-issue-reporter:1.3.1'  // was jcenter
    // TODO(BLD-001): com.rm:rmswitch:1.2.2 was jcenter-only; source repo unknown.
    //   Replace with androidx.appcompat.widget.SwitchCompat as part of AndroidX migration.
    //   For now: either locate the GitHub repo or keep as-is and accept a build warning.
    implementation 'com.rm:rmswitch:1.2.2'

    // Network / utilities
    implementation 'com.android.volley:volley:1.2.1'

    // JitPack — pinned to releases instead of master-SNAPSHOT
    implementation 'com.github.bravobit:jPastebin:1.0'        // was master-SNAPSHOT
    implementation 'com.github.iGio90:BottomDialogs:v1.0.0'   // was master-SNAPSHOT
}
