apply plugin: 'com.android.application'

android {
    // Load local.properties if present — not required for debug builds
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
    }

    compileSdk 34
    buildToolsVersion "34.0.0"

    namespace 'sksa.aa.tweaker'

    defaultConfig {
        applicationId 'sksa.aa.tweaker'
        minSdk 23
        targetSdk 34
        versionCode 35
        versionName '5.3.0'
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    // Signing config is optional — only applied when local.properties provides keys
    if (localProps['STORELOCATION']) {
        signingConfigs {
            release {
                storeFile file(localProps['STORELOCATION'])
                storePassword localProps['STOREPASSWORD']
                keyAlias 'key0'
                keyPassword localProps['KEYPASSWORD']
            }
        }
        android.buildTypes.release.signingConfig = signingConfigs.release
    }

    def pastebinKey = "\"${localProps['PASTEBIN_API_KEY'] ?: ''}\""

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "PASTEBIN_API_KEY", pastebinKey
        }
        debug {
            buildConfigField "String", "PASTEBIN_API_KEY", pastebinKey
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Android Support (kept until AndroidX migration — see Roadmap Phase 2)
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    // UI libs — migrated from jcenter to JitPack
    // Pinned to v.1.0.2 (the LAST support-library release). v.1.0.3 migrated
    // PageIndicatorView to AndroidX (androidx.viewpager.widget.ViewPager),
    // which this app does not ship — that mismatch makes com.rd.PageIndicatorView
    // fail to inflate in activity_main.xml and crashes MainActivity on launch
    // (NoClassDefFoundError: androidx/viewpager/widget/ViewPager$OnPageChangeListener).
    implementation 'com.github.romandanylyk:PageIndicatorView:v.1.0.2'
    // RMSwitch was jcenter-only; source is RiccardoMoro/RMSwitch, tag v1.2.2
    implementation 'com.github.RiccardoMoro:RMSwitch:v1.2.2'

    // Network / utilities
    implementation 'com.android.volley:volley:1.2.1'

    // JitPack — bravobit/jPastebin has no tags, pinned to latest commit
    implementation 'com.github.bravobit:jPastebin:2a05d9a'
}
