name: Build Debug APK

on:
  push:
    branches: [ master, "claude/**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create stub local.properties
        run: |
          echo "PASTEBIN_API_KEY=" > local.properties

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AA-AIO-TWEAKER-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator and system image
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "system-images;android-34;google_apis;x86_64" "emulator"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create stub local.properties
        run: echo "PASTEBIN_API_KEY=" > local.properties

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare test script
        run: |
          cat > emulator_test.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Installing APK: $APK"
          adb install "$APK"
          echo "Launching SplashActivity..."
          adb shell am start -W -n sksa.aa.tweaker/.SplashActivity
          sleep 10
          echo "Capturing logcat..."
          adb logcat -d > full_logcat.txt
          grep -E "AndroidRuntime|FATAL EXCEPTION|sksa\.aa\.tweaker" full_logcat.txt > crash_log.txt || true
          echo "=== RELEVANT LOG LINES ==="
          cat crash_log.txt
          echo "=== END ==="
          if grep -q "FATAL EXCEPTION" full_logcat.txt; then
            echo "CRASH DETECTED — full logcat follows:"
            cat full_logcat.txt
            exit 1
          fi
          echo "No fatal crash detected."
          SCRIPT
          chmod +x emulator_test.sh

      - name: Run launch test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./emulator_test.sh

      - name: Upload logcat artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logcat
          path: |
            full_logcat.txt
            crash_log.txt
          retention-days: 7
